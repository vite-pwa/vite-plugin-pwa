name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # git ls-remote https://github.com/sxzz/workflows main
    uses: sxzz/workflows/.github/workflows/release.yml@e3b122062c0844efea9328bd56c06ac337d72bc7 # main or v1
    with:
      publish: true
    permissions:
      contents: write
      id-token: write
