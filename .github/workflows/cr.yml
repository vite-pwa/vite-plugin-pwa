name: CR

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # pr or main
    # Skip pkg-pr-new on uppt release PRs (they don't include later main merges). Rely on main pushes instead.
    if: |
      github.event_name == 'push' || 
      (
        github.event_name == 'pull_request' && 
        !github.event.pull_request.draft && 
        contains(github.event.pull_request.labels.*.name, 'cr-tracked') && 
        !startsWith(github.head_ref, 'release/v')
      )
#    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'cr-tracked') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Publish
        # zizmor: ignore[use-trusted-publishing] false positive: publishing to ephemeral StackBlitz registry, not npm
        run: pnpx pkg-pr-new publish --compact --no-template --pnpm
